<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kero's YuGi Cards - Premium Trading Card Collector App">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kero YuGi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kero YuGi Cards</title>
  <link rel="manifest" href="manifest.json">

  <!-- Renderer fix for images -->
  <script src="https://unpkg.com/canvaskit-wasm@0.37.0/bin/canvaskit.js"></script>

  <script>
    var serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>
</head>
<body style="background-color: #000000; overflow: hidden;">
  <div id="loading" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <img src="icons/Icon-192.png" alt="Loading..." style="width: 100px; height: 100px; border-radius: 20px;">
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            useColorEmoji: true,
          }).then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
