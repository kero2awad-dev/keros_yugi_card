name: keros_yugi_card
description: "Kero's YuGi Cards - Premium Trading Card Collector App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^12.1.3

  # Backend & Auth
  supabase_flutter: ^2.0.2
  flutter_dotenv: ^5.1.0

  # Local Storage
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  package_info_plus: ^8.1.0

  # UI & UX
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  font_awesome_flutter: ^10.6.0
  flutter_svg: ^2.0.9
  intl: ^0.20.2
  url_launcher: ^6.2.1
  translator: ^1.0.4+1
  file_picker: ^8.0.1
  flutter_staggered_animations: ^1.0.0
  
  # File & Image Processing
  archive: ^3.3.7
  http: ^1.1.0
  image: ^4.1.3
  path_provider: ^2.1.2
  share_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#000000"
    theme_color: "#000000"

flutter:
  uses-material-design: true
  assets:
    - assets/env.txt
    - assets/data/
    - assets/icon.png
